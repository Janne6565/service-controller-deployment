apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single environment; everything lives in the `service-controller` namespace.
namespace: service-controller
resources:
  - ../../base
  - ingress.yaml
  - authentik.yaml
  - secret.sealed.yaml
# CI (service-controller-backend) rewrites newTag on push to main; ArgoCD then syncs.
images:
  - name: ghcr.io/janne6565/service-controller-backend
    newName: ghcr.io/janne6565/service-controller-backend
    newTag: main-6cc76be
  - name: ghcr.io/janne6565/service-controller-frontend
    newName: ghcr.io/janne6565/service-controller-frontend
    newTag: main-91aebe7
