# Authentik forward auth — the thing that actually keeps the admin UI private.
#
# Every request to the protected router is held at Traefik while it asks Authentik's embedded
# outpost whether this browser has a session. Unauthenticated requests never reach a pod: they get
# a 302 to sso.jannekeipert.de. The Authentik-side provider, application and the
# service-controller-users group gate live in
# cluster-deployment/infrastructure/authentik-service-controller-blueprint.yaml.
#
# Only the Middleware lives here; it is attached to the protected router by the
# `traefik.ingress.kubernetes.io/router.middlewares` annotation in ingress.yaml.
#
# The outpost's own callback path (/outpost.goauthentik.io) is NOT routed from this repo. It is
# published from the authentik namespace, in
# cluster-deployment/infrastructure/authentik-outpost-ingress.yaml — routing it from here would
# need an ExternalName Service, which Traefik refuses by default and then silently drops the
# router, so the path falls through to whatever serves `/`.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  labels:
    app.kubernetes.io/name: service-controller
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    # The outpost has to see the original host and scheme to build the right redirect back after
    # login.
    trustForwardHeader: true
    # Traefik copies exactly these from the outpost's response onto the request — overwriting
    # anything the client sent under the same names, which is why OperatorIdentityFilter is
    # allowed to treat X-authentik-username as proof on this router.
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
